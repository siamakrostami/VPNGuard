name: macOS checks and downloads

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          uname -m
      - name: Tests (live network diagnostic disabled)
        run: swift test
      - name: Build experimental app
        run: zsh scripts/build.sh
      - name: Audit public source
        run: python3 scripts/public-source.py --check
      - name: Package app and checksum
        run: zsh scripts/package-app.sh
      - name: Downloadable experimental app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VPNGuard-macOS-${{ runner.arch }}-experimental
          path: |
            dist/VPNGuard-macOS-*-experimental.zip
            dist/VPNGuard-macOS-*-experimental.zip.sha256
          if-no-files-found: error
          retention-days: 30
