name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Tests (live network diagnostic disabled)
        run: swift test
      - name: Local ad-hoc app build
        run: zsh scripts/build.sh
      - name: Audit public source
        run: python3 scripts/public-source.py --check
